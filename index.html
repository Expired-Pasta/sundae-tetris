<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍲 순대국 테트리스</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#141426 0%,#1e1e38 55%,#26192e 100%);
    display:flex;justify-content:center;align-items:flex-start;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;
    color:#eee;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap{width:min(96vw,460px);padding:10px 0 26px;text-align:center}
  h1{font-size:1.15rem;margin:6px 0 10px;letter-spacing:1px}
  .main{display:flex;gap:10px;justify-content:center;align-items:stretch}
  #board{
    touch-action:none;border:2px solid #44476a;border-radius:8px;
    width:min(56vw,300px);height:auto;background:#151527
  }
  .side{display:flex;flex-direction:column;gap:8px;width:112px}
  .box{background:#1f1f33;border:1px solid #333;border-radius:8px;padding:6px}
  .lbl{display:block;font-size:.68rem;opacity:.7;margin-bottom:2px}
  #nextC{width:100%;height:auto;background:#151527;border-radius:6px}
  .stats div{font-size:.72rem;display:flex;justify-content:space-between;padding:2px}
  .stats b{color:#ffd76e}
  button{
    touch-action:manipulation;appearance:none;border:0;border-radius:8px;
    background:#2d2d44;color:#eee;font-size:1rem;padding:10px;cursor:pointer;
    font-family:inherit
  }
  button:active{transform:scale(.95)}
  #pauseBtn{width:100%;font-size:.78rem;padding:8px}
  #pauseBtn:disabled{opacity:.4;cursor:default}
  .touchbar{display:flex;gap:8px;margin-top:12px}
  .touchbar button{flex:1;font-size:1.25rem;padding:14px 0;background:#26263c;border:1px solid #3d3d5c}
  .touchbar button.big{flex:1.25}
  .hint{font-size:.7rem;opacity:.65;line-height:1.5;margin-top:10px}
  #overlay{
    position:fixed;inset:0;background:rgba(8,8,16,.8);
    display:flex;justify-content:center;align-items:center;z-index:5
  }
  #overlay.hidden{display:none}
  .panel{
    background:#20203a;border:1px solid #3d3d5c;padding:26px 30px;
    border-radius:14px;text-align:center;max-width:82vw
  }
  #ovTitle{font-size:1.4rem;font-weight:700;margin-bottom:8px}
  #ovText{font-size:.85rem;opacity:.85;margin-bottom:18px;line-height:1.6}
  #startBtn{background:#e17055;color:#fff;font-weight:700;padding:12px 28px;font-size:1rem}
</style>
</head>
<body>
<div id="wrap">
  <h1>🍲 순대국 테트리스 🌶️</h1>
  <div class="main">
    <canvas id="board"></canvas>
    <div class="side">
      <div class="box">
        <span class="lbl">다음 블록</span>
        <canvas id="nextC" width="96" height="96"></canvas>
      </div>
      <div class="box stats">
        <div>점수 <b id="score">0</b></div>
        <div>줄 <b id="lines">0</b></div>
        <div>레벨 <b id="level">1</b></div>
      </div>
      <button id="pauseBtn" disabled>⏸ 일시정지</button>
    </div>
  </div>
  <div class="touchbar">
    <button id="btnLeft">◀</button>
    <button id="btnRot">🔄</button>
    <button id="btnRight">▶</button>
    <button id="btnDown">▼</button>
    <button id="btnDrop" class="big">⏬</button>
  </div>
  <p class="hint">
    PC: ← → 이동 · ↑ 회전 · ↓ 내림 · Space 즉시낙하 · P 일시정지<br>
    모바일: 아래 버튼 또는 게임판 <b>쓸기(스와이프)</b> · <b>탭 = 회전</b><br>
    재료: 🍜 🍲 🥩 🥬 🍚 🌶️ 🧄
  </p>
</div>

<div id="overlay">
  <div class="panel">
    <div id="ovTitle">🍲 순대국 테트리스 🍲</div>
    <div id="ovText">순대국 재료 블록을 쌓아 한 줄을 완성하면<br>맛있게 비워집니다!<br>줄을 지울수록 국물이 끓어 빨라져요 🔥</div>
    <button id="startBtn">게임 시작</button>
    <button id="extBtn" style="display:none;margin-top:10px;background:#2d2d44;font-weight:600">🌐 크롬으로 열기</button>
  </div>
</div>

<script>
(() => {
  // ===== 기본 설정 =====
  const COLS = 10, ROWS = 20, B = 30;             // 보드 10x20, 셀 30px
  const boardC = document.getElementById('board');
  const nextC   = document.getElementById('nextC');
  const ctx  = boardC.getContext('2d');
  const nctx = nextC.getContext('2d');
  boardC.width = COLS * B;
  boardC.height = ROWS * B;

  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  // ===== 블록 모양 / 색 / 순대국 재료 아이콘 =====
  const SHAPES = {
    I: [[1,1,1,1]],
    T: [[1,1,1],[0,1,0]],
    J: [[1,1,1],[1,0,0]],
    L: [[1,1,1],[0,0,1]],
    O: [[1,1],[1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]]
  };
  const COLORS = {
    I:'#e17055', T:'#ee5253', J:'#8d99ae', L:'#218c74',
    O:'#f6b93b', S:'#574b90', Z:'#0abde3'
  };
  // 원/점 그리기 헬퍼
  function disc(g, x, y, r, c){
    g.fillStyle = c;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // 재료 아이콘: 이모지 폰트 대신 캔버스 벡터로 직접 그림 (모든 브라우저/기기에서 동일하게 보임)
  // 설계 공간 20x20, 각 재료가 공간을 가득 채우도록 그림 (타일에 꽉 차게 표시됨)
  const ICON_DRAW = {
    I(g){ // 면 국물 그릇 (그릇+국물이 타일 가득)
      g.fillStyle = '#e07b39';                                        // 그릇 몸통
      g.beginPath(); g.arc(10, 7.5, 9.8, 0, Math.PI); g.closePath(); g.fill();
      g.fillStyle = '#b85619';                                        // 그릇 받침
      g.fillRect(6, 17.2, 8, 2.6);
      g.fillStyle = '#f5b942';                                        // 국물
      g.beginPath(); g.ellipse(10, 7.5, 9.8, 4.6, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffcf5c';                                        // 국물 광띠
      g.beginPath(); g.ellipse(10, 6.6, 8.6, 2.2, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff3d6'; g.lineWidth = 1.9; g.lineCap = 'round'; // 면발
      g.beginPath(); g.moveTo(3.4, 7.4); g.quadraticCurveTo(7, 4.6, 11, 7.6); g.stroke();
      g.beginPath(); g.moveTo(8.4, 9.4); g.quadraticCurveTo(12.4, 6.2, 16.4, 8.6); g.stroke();
      g.beginPath(); g.moveTo(5.4, 9.6); g.quadraticCurveTo(9, 7.6, 12.4, 10.2); g.stroke();
      g.fillStyle = '#7cb343';                                        // 파 고명
      disc(g, 6.4, 8.4, 1.1); disc(g, 11.6, 6.2, 1.1); disc(g, 14.4, 9.8, 1.1);
    },
    T(g){ // 뚝배기 (뚝배기가 타일 가득 + 김)
      g.fillStyle = '#7a4a28';                                        // 몸통
      rr(g, 1, 7.6, 18, 10.6, 3.6); g.fill();
      g.fillStyle = '#5d3319';                                        // 아래 띠 + 테두리
      g.fillRect(2.6, 16.6, 14.8, 1.9);
      g.beginPath(); g.ellipse(10, 7.8, 9.2, 2.7, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#f0a13c';                                        // 국물
      g.beginPath(); g.ellipse(10, 7.8, 7.4, 1.9, 0, 0, Math.PI * 2); g.fill();
      disc(g, 7.4, 7.6, 1.1, '#d63b2f');                              // 다진 고추
      disc(g, 12.6, 8.2, 1.1, '#d63b2f');
      g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1.4; g.lineCap = 'round'; // 김
      g.beginPath(); g.moveTo(4.6, 6); g.quadraticCurveTo(5.6, 4.4, 4.6, 2.8); g.stroke();
      g.beginPath(); g.moveTo(10, 6); g.quadraticCurveTo(11, 4.4, 10, 2.8); g.stroke();
      g.beginPath(); g.moveTo(15.4, 6); g.quadraticCurveTo(14.4, 4.4, 15.4, 2.8); g.stroke();
    },
    J(g){ // 고기 (고기 살이 타일 가득)
      g.fillStyle = '#c0533f';
      rr(g, 1.4, 4.2, 17.2, 13, 4.4); g.fill();
      g.fillStyle = '#8f2f24';                                        // 그을음 자국
      g.beginPath(); g.ellipse(3.8, 15.4, 2.6, 1.6, 0.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(16.4, 14.6, 2.4, 1.5, -0.3, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#f0b3a0'; g.lineWidth = 1.7; g.lineCap = 'round'; // 살결 마블링
      g.beginPath(); g.moveTo(3.8, 8.2); g.quadraticCurveTo(8, 6.2, 12, 8.4); g.stroke();
      g.beginPath(); g.moveTo(7.4, 11); g.quadraticCurveTo(11.6, 9, 16.2, 10.8); g.stroke();
      g.beginPath(); g.moveTo(5, 13.4); g.quadraticCurveTo(9.4, 11.8, 13.6, 13.6); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.25)';                         // 윤기
      g.beginPath(); g.ellipse(6.8, 5.8, 4, 1.1, -0.25, 0, Math.PI * 2); g.fill();
    },
    L(g){ // 상추 (잎이 타일 가득)
      g.fillStyle = '#3f9b56';
      g.beginPath(); g.ellipse(5, 10.5, 5.4, 8, -0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#4fae66';
      g.beginPath(); g.ellipse(15, 10.5, 5.4, 8, 0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#5fbe74';                                        // 가운데 잎
      g.beginPath(); g.ellipse(10, 11, 4.8, 7.2, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#2e7d46'; g.lineWidth = 1.3; g.lineCap = 'round'; // 잎맥
      g.beginPath(); g.moveTo(4.4, 4.6); g.quadraticCurveTo(3.6, 10.5, 4.6, 16.8); g.stroke();
      g.beginPath(); g.moveTo(15.6, 4.6); g.quadraticCurveTo(16.4, 10.5, 15.4, 16.8); g.stroke();
      g.beginPath(); g.moveTo(10, 4.4); g.lineTo(10, 17.8); g.stroke();
      g.lineWidth = 0.9;                                              // 갈라진 잎맥
      g.beginPath(); g.moveTo(7.6, 8); g.lineTo(10, 9); g.stroke();
      g.beginPath(); g.moveTo(12.4, 8); g.lineTo(10, 9); g.stroke();
      g.beginPath(); g.moveTo(7.4, 12.4); g.lineTo(10, 13.4); g.stroke();
      g.beginPath(); g.moveTo(12.6, 12.4); g.lineTo(10, 13.4); g.stroke();
    },
    O(g){ // 밥 (밥산이 타일 가득)
      g.fillStyle = '#fdfdf6';                                        // 흰 쌀 밥산
      disc(g, 5.8, 7.6, 4.4, '#fdfdf6');
      disc(g, 14.2, 7.6, 4.4, '#fdfdf6');
      disc(g, 10, 5.8, 4.9, '#fdfdf6');
      g.beginPath(); g.ellipse(10, 9.2, 9.9, 3.3, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#e6e2cf'; g.lineWidth = 1; g.lineCap = 'round'; // 쌀알 결
      g.beginPath(); g.moveTo(7, 7.2); g.quadraticCurveTo(8.4, 6.4, 9.6, 7.4); g.stroke();
      g.beginPath(); g.moveTo(11.6, 6); g.quadraticCurveTo(13.2, 5.4, 14, 6.8); g.stroke();
      g.beginPath(); g.moveTo(5.6, 9.2); g.quadraticCurveTo(7, 8.6, 8, 9.6); g.stroke();
      g.fillStyle = '#d95f5f';                                        // 빨간 밥공기
      g.beginPath(); g.arc(10, 10.2, 9.9, 0, Math.PI); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.35)';                       // 공기 광띠
      g.lineWidth = 1.8;
      g.beginPath(); g.arc(10, 10.4, 7.6, 0.35, Math.PI - 0.35); g.stroke();
      g.fillStyle = '#a83e3e';                                        // 공기 받침
      g.fillRect(6.4, 19.2, 7.2, 1.8);
    },
    S(g){ // 고추 (타일을 대각선으로 가로지르는 큰 고추)
      g.save();
      g.translate(10, 11); g.rotate(-0.62);
      g.fillStyle = '#d63b2f';
      g.beginPath(); g.ellipse(0.6, 0, 9.2, 3.5, 0, 0, Math.PI * 2); g.fill(); // 몸통
      g.beginPath();                                                  // 뾰족한 끝
      g.moveTo(-6.4, -3.2);
      g.quadraticCurveTo(-11.4, -1.2, -11.9, 0.6);
      g.quadraticCurveTo(-11.2, 2.4, -6.8, 3.3);
      g.closePath(); g.fill();
      g.fillStyle = '#e8654f';                                        // 광택
      g.beginPath(); g.ellipse(2.6, -1.15, 5.4, 1.05, 0.05, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3f7d3a';                                        // 꼭지
      rr(g, 9.2, -1.6, 4.2, 3.2, 1.4); g.fill();
      g.restore();
    },
    Z(g){ // 마늘 (알통이 타일 가득)
      g.fillStyle = '#f3ecf9';
      g.beginPath();
      g.moveTo(10, 0.6);
      g.quadraticCurveTo(17.8, 2.2, 18.8, 9.2);
      g.quadraticCurveTo(19.8, 16.2, 10, 19.4);
      g.quadraticCurveTo(0.2, 16.2, 1.2, 9.2);
      g.quadraticCurveTo(2.2, 2.2, 10, 0.6);
      g.closePath(); g.fill();
      g.strokeStyle = '#d5c7e3'; g.lineWidth = 1.3; g.lineCap = 'round'; // 마늘쪽 선
      g.beginPath(); g.moveTo(10, 2); g.lineTo(10, 18.6); g.stroke();
      g.beginPath(); g.moveTo(6.4, 4.6); g.quadraticCurveTo(4.6, 10.5, 6.6, 17.6); g.stroke();
      g.beginPath(); g.moveTo(13.6, 4.6); g.quadraticCurveTo(15.4, 10.5, 13.4, 17.6); g.stroke();
      g.beginPath(); g.moveTo(3.8, 6.6); g.quadraticCurveTo(2.4, 11, 4.4, 15.4); g.stroke();
      g.beginPath(); g.moveTo(16.2, 6.6); g.quadraticCurveTo(17.6, 11, 15.6, 15.4); g.stroke();
      g.fillStyle = '#e3d8ec';                                        // 뿌리
      g.beginPath(); g.ellipse(10, 18.8, 4.8, 1.2, 0, 0, Math.PI * 2); g.fill();
    }
  };

  // 아이콘을 한 번만 그려서 캐시(성능 + 선명도)
  const ICON_CACHE = {};
  function iconSprite(t){
    if(!ICON_CACHE[t]){
      const c = document.createElement('canvas');
      c.width = 48; c.height = 48;
      const g = c.getContext('2d');
      g.translate(4, 4);    // 20x20 설계 공간 여백(외곽 1px만 남김)
      g.scale(2, 2);        // 2배 → 축소해서 그릴 때 선명
      ICON_DRAW[t](g);
      ICON_CACHE[t] = c;
    }
    return ICON_CACHE[t];
  }

  // 크림색 스티커 판(실루엣): 아이콘 모양만 잘라낸 크림색 단판 → 아이콘 강조용
  const STICKER_CACHE = {};
  function iconSticker(t){
    if(!STICKER_CACHE[t]){
      const c = document.createElement('canvas');
      c.width = 48; c.height = 48;
      const g = c.getContext('2d');
      g.drawImage(iconSprite(t), 0, 0);
      // 그려진 픽셀 영역만 크림색으로 채워 실루엣 생성
      g.globalCompositeOperation = 'source-in';
      g.fillStyle = '#fff6e8';
      g.fillRect(0, 0, 48, 48);
      STICKER_CACHE[t] = c;
    }
    return STICKER_CACHE[t];
  }

  function drawIcon(g, t, x, y, size, pad){
    // 크림 스티커 실루엣을 살짝 크게 깔고, 불투명 아이콘을 그 위에 → 아이콘이 강조됨
    const p = pad === undefined ? 2 : pad;
    g.drawImage(iconSticker(t), x - p, y - p, size + p * 2, size + p * 2);
    g.drawImage(iconSprite(t), x, y, size, size);
  }
  const TYPES = Object.keys(SHAPES);

  // ===== 게임 상태 =====
  let grid, cur, nextP;
  let score = 0, lines = 0, level = 1;
  let dropInterval = 550, dropAcc = 0, lastT = 0;
  let state = 'menu'; // menu | play | pause | over

  const emptyGrid = () => Array.from({length: ROWS}, () => Array(COLS).fill(null));

  // ===== 핵심 로직 =====
  function newPiece(){
    const t = TYPES[Math.floor(Math.random() * TYPES.length)];
    // 원본 모양을 복사해서 사용 (공유 참조 버그 방지)
    const m = SHAPES[t].map(r => r.slice());
    return { t, m, x: 0, y: 0 };
  }

  function collide(p, m = p.m, ox = 0, oy = 0){
    for(let y = 0; y < m.length; y++){
      for(let x = 0; x < m[y].length; x++){
        if(!m[y][x]) continue;
        const bx = p.x + ox + x, by = p.y + oy + y;
        if(bx < 0 || bx >= COLS || by >= ROWS) return true;
        if(by >= 0 && grid[by][bx]) return true;
      }
    }
    return false;
  }

  function spawn(){
    cur = nextP || newPiece();
    nextP = newPiece();
    // ★ 새 블록에 항상 올바른 x 좌표를 부여 (이전 버전의 핵심 버그)
    cur.x = Math.floor((COLS - cur.m[0].length) / 2);
    cur.y = 0;
    drawNext();
    if(collide(cur)){
      cur.y = -1;
      if(collide(cur)) return gameOver();
    }
  }

  function lock(){
    for(let y = 0; y < cur.m.length; y++)
      for(let x = 0; x < cur.m[y].length; x++)
        if(cur.m[y][x]){
          const by = cur.y + y, bx = cur.x + x;
          if(by >= 0) grid[by][bx] = { c: COLORS[cur.t], t: cur.t };
        }
    clearLines();
    spawn();
  }

  function clearLines(){
    const kept = grid.filter(row => !row.every(Boolean));
    const n = ROWS - kept.length;
    if(n === 0) return;
    while(kept.length < ROWS) kept.unshift(Array(COLS).fill(null));
    grid = kept;
    lines += n;
    score += [0, 100, 300, 500, 800][n] * level;
    const nl = 1 + Math.floor(lines / 8);
    if(nl !== level){
      level = nl;
      dropInterval = Math.max(120, 550 - (level - 1) * 45);
    }
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function canMove(dx, dy){ return !collide(cur, cur.m, dx, dy); }

  function moveH(d){ if(state === 'play' && canMove(d, 0)) cur.x += d; }

  function softDrop(){
    if(state !== 'play') return;
    if(canMove(0, 1)) cur.y++;
    else lock();
  }

  function hardDrop(){
    if(state !== 'play') return;
    let n = 0;
    while(canMove(0, 1)){ cur.y++; n++; }
    score += n * 2;
    updateHUD();
    lock();
  }

  function tryRotate(){
    if(state !== 'play') return;
    const N = cur.m.length, M = cur.m[0].length;
    const rm = Array.from({length: M}, () => Array(N).fill(0));
    for(let y = 0; y < N; y++)
      for(let x = 0; x < M; x++)
        rm[x][N - 1 - y] = cur.m[y][x];
    // 간단한 벽 킥(wall kick): 좌우로 밀려나면서 회전 시도
    for(const o of [0, -1, 1, -2, 2]){
      if(!collide(cur, rm, o, 0)){ cur.m = rm; cur.x += o; return; }
    }
  }

  // ===== 상태 전환 =====
  function start(){
    grid = emptyGrid();
    score = 0; lines = 0; level = 1;
    dropInterval = 550; dropAcc = 0;
    cur = null;
    nextP = newPiece();
    updateHUD();
    spawn();
    state = 'play';
    pauseBtn.disabled = false;
    pauseBtn.textContent = '⏸ 일시정지';
    overlay.classList.add('hidden');
  }

  function togglePause(){
    if(state === 'play'){ state = 'pause'; pauseBtn.textContent = '▶ 계속'; }
    else if(state === 'pause'){ state = 'play'; pauseBtn.textContent = '⏸ 일시정지'; }
  }

  function gameOver(){
    state = 'over';
    pauseBtn.disabled = true;
    ovTitle.textContent = '🍽️ 게임 오버';
    ovText.innerHTML = '점수 <b style="color:#ffd76e">' + score + '</b> · 지운 줄 <b style="color:#ffd76e">' + lines + '</b><br>국밥은 다 비었지만 다시 데워드릴게요!';
    startBtn.textContent = '다시 시작';
    overlay.classList.remove('hidden');
  }

  // ===== 그리기 =====
  function rr(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawCellAt(g, px, py, cs, t, c, alpha){
    const a = alpha === undefined ? 1 : alpha;
    const s = cs - 2;                               // 타일 크기(셀에 거의 꽉 차게)
    const r = Math.min(7, s * 0.26);

    // 1) 블록: 아주 반투명한 유리판
    g.globalAlpha = a * 0.25;                       // 바탕 진하기 0.25 ( 배경이 비침 )
    g.fillStyle = c;
    rr(g, px + 1, py + 1, s, s, r);
    g.fill();
    // 테두리: 블록 형태만 은은하게 유지
    g.globalAlpha = a * 0.6;
    g.strokeStyle = c;
    g.lineWidth = 1.6;
    rr(g, px + 1.8, py + 1.8, s - 1.6, s - 1.6, Math.max(2.5, r - 1.8));
    g.stroke();

    // 2) 아이콘: 완전 불투명 + 크림 스티커 실루엣 → 강조
    g.globalAlpha = a;
    drawIcon(g, t, px + 1, py + 1, s);
    g.globalAlpha = 1;
  }

  // 유령(낙하 예측) 전용 렌더링: 아이콘 없이 블록 외형(점선 테두리 + 옅은 바탕)만 표시
  function drawGhostCell(g, px, py, cs, c){
    const s = cs - 2;
    const r = Math.min(7, s * 0.26);
    g.save();
    // 옅은 바탕
    g.globalAlpha = 0.2;
    g.fillStyle = c;
    rr(g, px + 1, py + 1, s, s, r);
    g.fill();
    // 점선 테두리 → "착지 지점" 표시
    g.globalAlpha = 0.85;
    g.strokeStyle = c;
    g.lineWidth = 1.6;
    g.setLineDash([5, 4]);
    rr(g, px + 1.8, py + 1.8, s - 1.6, s - 1.6, Math.max(2.5, r - 1.8));
    g.stroke();
    g.setLineDash([]);
    g.restore();
  }

  function drawNext(){
    nctx.clearRect(0, 0, nextC.width, nextC.height);
    if(!nextP) return;
    const m = nextP.m, cs = 20;
    const ox = (nextC.width  - m[0].length * cs) / 2;
    const oy = (nextC.height - m.length   * cs) / 2;
    for(let y = 0; y < m.length; y++)
      for(let x = 0; x < m[y].length; x++)
        if(m[y][x]) drawCellAt(nctx, ox + x * cs, oy + y * cs, cs, nextP.t, COLORS[nextP.t]);
  }

  function ghostY(){
    let dy = 0;
    while(!collide(cur, cur.m, 0, dy + 1)) dy++;
    return dy;
  }

  function draw(){
    // 배경
    ctx.fillStyle = '#151527';
    ctx.fillRect(0, 0, boardC.width, boardC.height);
    // 격자
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for(let x = 1; x < COLS; x++){
      ctx.beginPath(); ctx.moveTo(x * B, 0); ctx.lineTo(x * B, ROWS * B); ctx.stroke();
    }
    for(let y = 1; y < ROWS; y++){
      ctx.beginPath(); ctx.moveTo(0, y * B); ctx.lineTo(COLS * B, y * B); ctx.stroke();
    }
    // 쌓인 블록
    for(let y = 0; y < ROWS; y++)
      for(let x = 0; x < COLS; x++){
        const c = grid[y][x];
        if(c) drawCellAt(ctx, x * B, y * B, B, c.t, c.c);
      }
    // 현재 블록 + 유령(낙하 위치 표시)
    if(cur && (state === 'play' || state === 'pause')){
      const dy = ghostY();
      for(let y = 0; y < cur.m.length; y++)
        for(let x = 0; x < cur.m[y].length; x++)
          if(cur.m[y][x])
            drawGhostCell(ctx, (cur.x + x) * B, (cur.y + dy + y) * B, B, COLORS[cur.t]);
      for(let y = 0; y < cur.m.length; y++)
        for(let x = 0; x < cur.m[y].length; x++)
          if(cur.m[y][x] && cur.y + y >= 0)
            drawCellAt(ctx, (cur.x + x) * B, (cur.y + y) * B, B, cur.t, COLORS[cur.t]);
    }
    if(state === 'pause'){
      ctx.fillStyle = 'rgba(10,10,20,0.55)';
      ctx.fillRect(0, 0, boardC.width, boardC.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('일시정지', boardC.width / 2, boardC.height / 2);
    }
  }

  // ★ 게임 루프 (이전 버전에서 호출되지 않았던 핵심 누락 부분)
  function loop(t){
    const dt = Math.min(100, t - lastT);
    lastT = t;
    if(state === 'play'){
      dropAcc += dt;
      if(dropAcc > dropInterval){
        dropAcc = 0;
        if(canMove(0, 1)) cur.y++;
        else lock();
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ===== 입력: PC 키보드 =====
  document.addEventListener('keydown', e => {
    const k = e.key;
    if([' ', 'ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp'].includes(k)) e.preventDefault();
    if(state === 'menu' || state === 'over'){
      if(k === ' ' || k === 'Enter') start();
      return;
    }
    if(k === 'p' || k === 'P'){ togglePause(); return; }
    if(state !== 'play') return;
    if(k === 'ArrowLeft') moveH(-1);
    else if(k === 'ArrowRight') moveH(1);
    else if(k === 'ArrowDown') softDrop();
    else if(k === 'ArrowUp') tryRotate();
    else if(k === ' ') hardDrop();
  });

  // ===== 입력: 모바일 터치 버튼 (길게 누르면 반복) =====
  function bindHold(el, fn, repeat){
    let iv = null;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      fn();
      if(repeat) iv = setInterval(fn, 110);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
      el.addEventListener(ev, () => { if(iv){ clearInterval(iv); iv = null; } })
    );
  }
  bindHold(document.getElementById('btnLeft'),  () => moveH(-1), true);
  bindHold(document.getElementById('btnRight'), () => moveH(1),  true);
  bindHold(document.getElementById('btnDown'),  softDrop,  true);
  bindHold(document.getElementById('btnRot'),   tryRotate, false);
  bindHold(document.getElementById('btnDrop'),  hardDrop,  false);

  // ===== 입력: 게임판 스와이프 / 탭 =====
  let touchStart = null;
  boardC.addEventListener('pointerdown', e => {
    touchStart = { x: e.clientX, y: e.clientY };
  });
  boardC.addEventListener('pointerup', e => {
    if(!touchStart) return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    touchStart = null;
    if(state !== 'play') return;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if(Math.max(adx, ady) < 20){ tryRotate(); return; }   // 탭 = 회전
    if(adx > ady) moveH(dx > 0 ? 1 : -1);                  // 좌우 스와이프
    else if(dy > 0) softDrop();                            // 아래 스와이프
  });

  // ===== 버튼 연결 =====
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', togglePause);

  // 카카오톡 인앱 브라우저 등에서 열렸을 때 → 외부 브라우저(크롬)로 새로 열기 버튼 표시
  (function setupExternalOpen(){
    const isHttp   = location.protocol === 'https:' || location.protocol === 'http:';
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS    = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(!isHttp || !(isAndroid || isIOS)) return;    // PC / file:// 에서는 숨김
    const extBtn = document.getElementById('extBtn');
    extBtn.style.display = 'block';
    extBtn.addEventListener('click', () => {
      const target = location.host + location.pathname + location.search;
      if(isAndroid){
        // 안드로이드: 인텐트로 크롬 강제 실행
        location.href = 'intent://' + target + '#Intent;scheme=' + location.protocol.replace(':', '') + ';package=com.android.chrome;end';
      }else{
        // iOS: 크롬 앱 스킴
        location.href = 'googlechrome://' + target;
      }
    });
  })();

  // ===== 시작 =====
  grid = emptyGrid();
  updateHUD();
  overlay.classList.remove('hidden');
  requestAnimationFrame(loop);
})();
</script>
</body>
